<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>3D shape editor</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: #14161a;
    color: #e7e9ee;
    font: 13px/1.4 ui-sans-serif, system-ui, "Segoe UI", Roboto, sans-serif;
    display: flex;
    flex-direction: column;
  }
  #toolbar {
    display: flex;
    gap: 6px;
    align-items: center;
    flex-wrap: wrap;
    padding: 8px 10px;
    background: #1d2027;
    border-bottom: 1px solid #2b2f38;
  }
  #toolbar .sep { width: 1px; height: 20px; background: #2b2f38; margin: 0 4px; }
  button {
    background: #262a33;
    color: inherit;
    border: 1px solid #363b46;
    border-radius: 6px;
    padding: 5px 10px;
    font: inherit;
    cursor: pointer;
  }
  button:hover:not(:disabled) { background: #313742; }
  button:disabled { opacity: 0.4; cursor: default; }
  .swatch {
    width: 20px; height: 20px; padding: 0;
    border-radius: 5px; border: 1px solid #0006;
  }
  #toolbar label { color: #99a1b0; display: flex; align-items: center; gap: 5px; }
  #toolbar input[type="color"] {
    width: 26px; height: 24px; padding: 0;
    border: 1px solid #363b46; border-radius: 5px;
    background: #262a33; cursor: pointer;
  }
  #toolbar input[type="range"] { width: 90px; accent-color: #599ef2; }
  #stage { position: relative; flex: 1; min-height: 0; }
  canvas { display: block; width: 100%; height: 100%; }
  #coords {
    display: flex;
    gap: 10px;
    padding: 5px 10px;
    background: #171a20;
    border-top: 1px solid #2b2f38;
  }
  #coords label { color: #99a1b0; display: flex; align-items: center; gap: 5px; }
  #coords input {
    width: 82px;
    background: #262a33;
    color: #e7e9ee;
    border: 1px solid #363b46;
    border-radius: 5px;
    padding: 3px 6px;
    font: inherit;
  }
  #coords input:disabled { opacity: 0.45; }
  #coords label:nth-child(1) input { border-left: 3px solid #eb5b52; }
  #coords label:nth-child(2) input { border-left: 3px solid #73de66; }
  #coords label:nth-child(3) input { border-left: 3px solid #599ef2; }
  #coords.second { border-top: none; }
  #hint {
    padding: 6px 10px;
    background: #1d2027;
    border-top: 1px solid #2b2f38;
    color: #99a1b0;
  }
  #hint b { color: #e7e9ee; font-weight: 600; }
  #gl-error {
    position: absolute; inset: 0;
    display: none;
    place-items: center;
    padding: 24px;
    text-align: center;
    background: #14161a;
    color: #ff9f9f;
  }
</style>
</head>
<body>
  <div id="toolbar">
    <button id="add-box">Box</button>
    <button id="add-sphere">Sphere</button>
    <button id="add-cylinder">Cylinder</button>
    <button id="add-cone">Cone</button>
    <button id="add-pyramid">Pyramid</button>
    <button id="add-torus">Torus</button>
    <button id="add-capsule">Capsule</button>
    <button id="add-tube">Tube</button>
    <span class="sep"></span>
    <button class="swatch" data-color="0" style="background:#e8503a" title="1"></button>
    <button class="swatch" data-color="1" style="background:#f0a02a" title="2"></button>
    <button class="swatch" data-color="2" style="background:#e8d44a" title="3"></button>
    <button class="swatch" data-color="3" style="background:#63c95d" title="4"></button>
    <button class="swatch" data-color="4" style="background:#3aa8e8" title="5"></button>
    <button class="swatch" data-color="5" style="background:#7a5ce8" title="6"></button>
    <button class="swatch" data-color="6" style="background:#e85ca8" title="7"></button>
    <button class="swatch" data-color="7" style="background:#d8dde6" title="8"></button>
    <label>Colour <input id="color" type="color" value="#e8503a" disabled></label>
    <label>Opacity <input id="opacity" type="range" min="0" max="1" step="0.05" value="1" disabled></label>
    <span class="sep"></span>
    <button id="delete" disabled>Delete</button>
    <button id="duplicate" disabled>Duplicate</button>
    <span class="sep"></span>
    <button data-align="min:x" title="Align min edge on X" disabled>X min</button>
    <button data-align="centre:x" title="Align centre on X" disabled>X mid</button>
    <button data-align="max:x" title="Align max edge on X" disabled>X max</button>
    <button data-align="min:y" title="Align min edge on Y" disabled>Y min</button>
    <button data-align="centre:y" title="Align centre on Y" disabled>Y mid</button>
    <button data-align="max:y" title="Align max edge on Y" disabled>Y max</button>
    <button data-align="min:z" title="Align min edge on Z" disabled>Z min</button>
    <button data-align="centre:z" title="Align centre on Z" disabled>Z mid</button>
    <button data-align="max:z" title="Align max edge on Z" disabled>Z max</button>
    <span class="sep"></span>
    <button data-distribute="x" title="Distribute evenly along X" disabled>Dist X</button>
    <button data-distribute="y" title="Distribute evenly along Y" disabled>Dist Y</button>
    <button data-distribute="z" title="Distribute evenly along Z" disabled>Dist Z</button>
    <span class="sep"></span>
    <button id="group" title="Boolean-group selection (G)">Group</button>
    <button id="ungroup" title="Restore grouped sources (Shift+G)" disabled>Ungroup</button>
    <button id="hole" title="Toggle hole cutter on selection (H)" disabled>Hole</button>
    <span class="sep"></span>
    <button id="undo" disabled>Undo</button>
    <button id="redo" disabled>Redo</button>
    <button id="snap">Snap: off</button>
    <span class="sep"></span>
    <button id="import">Import STL</button>
    <input id="file" type="file" accept=".stl" hidden>
    <span class="sep"></span>
    <button id="save">Save</button>
    <button id="load">Load</button>
    <button id="export" disabled>Export STL</button>
    <button id="png">PNG</button>
  </div>
  <div id="stage">
    <canvas id="view"></canvas>
    <div id="gl-error">WebGL2 is unavailable in this browser, so the 3D viewport cannot start.</div>
  </div>
  <div id="coords">
    <label>X <input id="pos-x" type="number" step="0.5" disabled></label>
    <label>Y <input id="pos-y" type="number" step="0.5" disabled></label>
    <label>Z <input id="pos-z" type="number" step="0.5" disabled></label>
    <label>Name <input id="name" type="text" disabled></label>
  </div>
  <div id="coords" class="second">
    <label>Rot X <input id="rot-x" type="number" step="15" disabled></label>
    <label>Rot Y <input id="rot-y" type="number" step="15" disabled></label>
    <label>Rot Z <input id="rot-z" type="number" step="15" disabled></label>
    <label>Step <select id="rot-step">
      <option value="5">5&deg;</option>
      <option value="15" selected>15&deg;</option>
      <option value="45">45&deg;</option>
    </select></label>
    <span class="sep"></span>
    <label>Size X <input id="size-x" type="number" step="0.1" min="0.1" disabled></label>
    <label>Size Y <input id="size-y" type="number" step="0.1" min="0.1" disabled></label>
    <label>Size Z <input id="size-z" type="number" step="0.1" min="0.1" disabled></label>
    <label><input id="uniform" type="checkbox"> Uniform</label>
  </div>
  <div id="hint">Drag to orbit &middot; shift-drag to pan &middot; wheel to zoom &middot; click a shape to select</div>
  <script type="module" src="./src/app.js"></script>
</body>
</html>
